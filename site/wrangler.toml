# Cloudflare Pages — Direct Upload of dist/. Static only (no Workers SSR adapter).
# Pages project name (scripts/deploy.sh creates it on first deploy); override with CLOUDFLARE_PAGES_PROJECT.
name = "standup-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# One Pages Function, functions/_middleware.js: markdown for requests that prefer it (see public/_routes.json).
# Keep the marketing surface static: do not add an SSR adapter for forms.
