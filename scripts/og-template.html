<!doctype html>
<!-- Share card for `npm run generate:og`, which fills the slots, colors, lang and dir from the site. -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/700.css" />
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #1a1a18;
        --accent: #1a1a18;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        padding: 88px 96px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background: var(--paper);
        color: var(--ink);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }

      /* Same reason as global.css: no Arabic, Hebrew, Devanagari or CJK in JetBrains Mono. */
      [data-font='system'] body {
        font-family: system-ui, sans-serif;
      }

      .rule {
        width: 120px;
        height: 8px;
        background: var(--accent);
      }

      h1,
      p {
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
      }

      h1 {
        margin-top: auto;
        font-size: 80px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        -webkit-line-clamp: 2;
      }

      p {
        margin-top: 28px;
        max-width: 36ch;
        font-size: 30px;
        line-height: 1.4;
        color: color-mix(in oklab, var(--ink) 72%, var(--paper));
        -webkit-line-clamp: 3;
      }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <h1 data-slot="name"></h1>
    <p data-slot="description"></p>
  </body>
</html>
