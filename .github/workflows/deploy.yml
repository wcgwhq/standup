# Deploys the site to Cloudflare Pages on every push to main that changes it.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit) and CLOUDFLARE_ACCOUNT_ID.
# site/scripts/deploy.sh does the work: it builds, runs every check and uploads. A failed check stops the deploy.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'plugin/.claude-plugin/plugin.json' # the site prints the plugin version
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # dateModified is the last commit that touched site/
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'site/.nvmrc'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run deploy -- https://standup.wcgw.fun
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
