# Smoke build of the site, and a run of the plugin's scripts, on every push / PR. Deploy stays manual (`npm run deploy`) or a
# follow-up workflow with Cloudflare secrets — keep this job secret-free.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: http://localhost:4321/
      SITE_NAME: CI
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'site/.nvmrc'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The engine must stay runnable on the oldest Python it claims. The runner image no
    # longer offers 3.9 through setup-python, so the job runs in the official 3.9 image.
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v7
      - run: python3 plugin/skills/eod-review/eod_review.py --help
      - run: python3 plugin/skills/eow-review/eow_review.py --help
