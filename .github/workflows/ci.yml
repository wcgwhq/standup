# Smoke build of the site, and a run of the plugin's scripts, on every push / PR. Deploying is deploy.yml;
# keep this job secret-free.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: http://localhost:4321/
      SITE_NAME: CI
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'site/.nvmrc'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The engine must stay runnable on the oldest Python it claims. The runner image no
    # longer offers 3.9 through setup-python, so the job runs in the official 3.9 image.
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v7
      # Every manifest an agent installs from carries the same version.
      - run: |
          python3 - <<'PY'
          import json, sys
          files = ["plugin/plugin.json", "plugin/.claude-plugin/plugin.json", "plugin/.cursor-plugin/plugin.json", "gemini-extension.json"]
          versions = {f: json.load(open(f))["version"] for f in files}
          print(versions)
          sys.exit(len(set(versions.values())) != 1)
          PY
      - run: python3 plugin/skills/standup/standup.py --help
      - run: python3 plugin/skills/standup/standup_week.py --help
